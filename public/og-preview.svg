<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#172957"/>
      <stop offset="70%" stop-color="#080F27"/>
      <stop offset="100%" stop-color="#050818"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7C85B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F7C85B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFF1D0"/>
      <stop offset="65%" stop-color="#F7C85B"/>
      <stop offset="90%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D9383A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1D0"/>
      <stop offset="50%" stop-color="#F7C85B"/>
      <stop offset="100%" stop-color="#FFA439"/>
    </linearGradient>
  </defs>

  <!-- Cosmic Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#FFF1D0">
    <circle cx="120" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="280" cy="140" r="2" opacity="0.8"/>
    <circle cx="450" cy="80" r="1" opacity="0.5"/>
    <circle cx="750" cy="110" r="1.8" opacity="0.7"/>
    <circle cx="920" cy="70" r="2.2" opacity="0.9"/>
    <circle cx="1060" cy="160" r="1.5" opacity="0.6"/>
    <circle cx="180" cy="380" r="1.2" opacity="0.5"/>
    <circle cx="340" cy="480" r="2" opacity="0.8"/>
    <circle cx="890" cy="510" r="1.6" opacity="0.7"/>
    <circle cx="1040" cy="420" r="2" opacity="0.8"/>
    <circle cx="600" cy="90" r="2.5" opacity="0.9"/>
  </g>

  <!-- Big Central Diya Glow -->
  <circle cx="600" cy="270" r="220" fill="url(#glow)"/>

  <!-- 12 Petal Lotus Mandala -->
  <g transform="translate(600, 270)" stroke="#F7C85B" stroke-opacity="0.25" fill="none">
    <circle r="160" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="140" stroke-width="1"/>
    <circle r="110" stroke-width="0.75"/>
  </g>

  <!-- Grand Central Diya -->
  <g transform="translate(600, 270)">
    <!-- Flame -->
    <path d="M0 -110 C-25 -60 -20 -30 0 0 C20 -30 25 -60 0 -110 Z" fill="url(#flameGrad)"/>
    <circle cx="0" cy="-20" r="8" fill="#FFF8E7"/>

    <!-- Brass Diya Rim -->
    <ellipse cx="0" cy="15" rx="90" ry="22" fill="#D49228" stroke="#F7C85B" stroke-width="2"/>
    <ellipse cx="0" cy="15" rx="78" ry="14" fill="#6A2E0B"/>

    <!-- Diya Bowl -->
    <path d="M-90 15 Q0 90 90 15 Q65 95 0 95 Q-65 95 -90 15 Z" fill="#8C4A14" stroke="#F7C85B" stroke-width="2"/>
    <ellipse cx="0" cy="96" rx="28" ry="6" fill="#D49228"/>
  </g>

  <!-- Headline & Subtitle -->
  <text x="600" y="460" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="54" fill="url(#goldText)" text-anchor="middle" letter-spacing="2">
    DIWALI GALAXY WISHES
  </text>
  <text x="600" y="515" font-family="'Outfit', sans-serif" font-weight="400" font-size="24" fill="#FFF1D0" opacity="0.85" text-anchor="middle" letter-spacing="4">
    LIGHT UP SOMEONE’S UNIVERSE
  </text>

  <!-- Sanskrit Tagline -->
  <text x="600" y="565" font-family="'Cinzel', serif" font-size="18" fill="#F7C85B" opacity="0.75" text-anchor="middle">
    ✦ तमसो मा ज्योतिर्गमय ✦
  </text>
</svg>
